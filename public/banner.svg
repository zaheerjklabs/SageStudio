<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="bannerSageGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bannerBgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111113"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="bannerTitleGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="bannerGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    </pattern>
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="200" fill="#0a0a0b"/>
  <rect width="800" height="200" fill="url(#bannerGrid)" opacity="0.04"/>

  <!-- logo.svg embedded -->
  <g transform="translate(40, 40)">
    <rect width="120" height="120" rx="28" fill="url(#bannerBgGrad)"/>
    <rect width="120" height="120" rx="28" stroke="#27272a" stroke-width="1.5" fill="none"/>
    <path d="M24 88 C24 88 28 32 60 32 C92 32 96 88 96 88" stroke="url(#bannerSageGrad)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#bannerGlow)"/>
    <circle cx="38" cy="58" r="5" fill="#6366f1" opacity="0.9"/>
    <circle cx="60" cy="46" r="5" fill="#10b981" opacity="0.9"/>
    <circle cx="82" cy="58" r="5" fill="#6366f1" opacity="0.9"/>
    <line x1="38" y1="58" x2="60" y2="46" stroke="#6366f1" stroke-width="1.5" opacity="0.35"/>
    <line x1="60" y1="46" x2="82" y2="58" stroke="#10b981" stroke-width="1.5" opacity="0.35"/>
    <text x="60" y="108" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="2">SAGESTUDIO</text>
  </g>

  <text x="200" y="88" fill="url(#bannerTitleGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" letter-spacing="-1">SageStudio</text>
  <text x="202" y="122" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="17" font-weight="400">Visualize. Experiment. Understand.</text>
  <text x="202" y="148" fill="#71717a" font-family="system-ui, sans-serif" font-size="13">Interactive AI, Mathematics &amp; Algorithms — by ZaheerJKLabs</text>

  <circle cx="680" cy="60" r="3" fill="#6366f1" opacity="0.6"/>
  <circle cx="720" cy="90" r="4" fill="#10b981" opacity="0.5"/>
  <circle cx="700" cy="130" r="2.5" fill="#6366f1" opacity="0.4"/>
  <circle cx="740" cy="150" r="3" fill="#10b981" opacity="0.3"/>
  <line x1="680" y1="60" x2="720" y2="90" stroke="#6366f1" stroke-width="0.8" opacity="0.2"/>
  <line x1="720" y1="90" x2="700" y2="130" stroke="#10b981" stroke-width="0.8" opacity="0.2"/>
</svg>
