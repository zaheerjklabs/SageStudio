<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="#0a0a0b"/>
  <rect width="800" height="200" fill="url(#grid)" opacity="0.03"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
  </pattern>
  <!-- Logo mark -->
  <g transform="translate(60, 50)">
    <rect width="100" height="100" rx="22" fill="#111113" stroke="#27272a" stroke-width="1.5"/>
    <path d="M20 74 C20 74 24 26 50 26 C76 26 80 74 80 74" stroke="url(#curveGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="32" cy="48" r="4.5" fill="#6366f1"/>
    <circle cx="50" cy="38" r="4.5" fill="#10b981"/>
    <circle cx="68" cy="48" r="4.5" fill="#6366f1"/>
    <line x1="32" y1="48" x2="50" y2="38" stroke="#6366f1" stroke-width="1.2" opacity="0.4"/>
    <line x1="50" y1="38" x2="68" y2="48" stroke="#10b981" stroke-width="1.2" opacity="0.4"/>
  </g>
  <!-- Title -->
  <text x="200" y="95" fill="url(#titleGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">SageStudio</text>
  <text x="202" y="130" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="18" font-weight="400">Visualize. Experiment. Understand.</text>
  <text x="202" y="155" fill="#71717a" font-family="system-ui, sans-serif" font-size="13">Interactive AI, Mathematics &amp; Algorithms  by ZaheerJKLabs</text>
  <!-- Decorative nodes -->
  <circle cx="680" cy="60" r="3" fill="#6366f1" opacity="0.6"/>
  <circle cx="720" cy="90" r="4" fill="#10b981" opacity="0.5"/>
  <circle cx="700" cy="130" r="2.5" fill="#6366f1" opacity="0.4"/>
  <circle cx="740" cy="150" r="3" fill="#10b981" opacity="0.3"/>
  <line x1="680" y1="60" x2="720" y2="90" stroke="#6366f1" stroke-width="0.8" opacity="0.2"/>
  <line x1="720" y1="90" x2="700" y2="130" stroke="#10b981" stroke-width="0.8" opacity="0.2"/>
</svg>
